server:
  port: 8082
spring:
  application:
    name: datafactory-streams
  datasource:
    url: ${DB_URL:jdbc:postgresql://weather_db:5432/weather_guard}
    username: ${DB_USER:weather_user}
    password: ${DB_PASS:weather_pass}
    hikari:
      maximum-pool-size: 10
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    streams:
      application-id: weather-consumer-app
      properties:
        num.streams.threads: 4
        auto.offset.reset: earliest

app:
  go-service-url: ${GO_SERVICE_URL:http://golang:8000/weather/batch}
  weather-batch-size: 250
  aq-batch-size: 50